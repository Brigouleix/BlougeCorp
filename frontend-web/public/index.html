<!DOCTYPE html>
<html lang="fr">
<head>
    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Organisateur de vacances</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    

    <!-- Suppress noisy browser errors before CRA overlay registers its own handler -->
    <script>
      (function() {
        var IGNORED = ['ResizeObserver loop', '_leaflet_pos', 'leaflet', 'Script error'];
        window.addEventListener('error', function(e) {
          var msg = e.message || '';
          for (var i = 0; i < IGNORED.length; i++) {
            if (!msg || msg.indexOf(IGNORED[i]) !== -1) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return;
            }
          }
        }, true);
      })();
    </script>

    <!-- Leaflet servi localement (même origine → plus de "Script error." cross-origin) -->
    <link rel="stylesheet" href="%PUBLIC_URL%/leaflet.css" />
    <script src="%PUBLIC_URL%/leaflet.js"></script>
</head>
<body>
    <div id="root"></div>  <!-- Point de montage React -->
</body>
</html>
